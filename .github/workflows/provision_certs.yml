name: Provision Certificates

# One-time setup workflow. Run this MANUALLY (Actions tab → Run workflow)
# the first time you push this repo, AND any time the org's distribution
# cert is rotated. It:
#   1. Creates the bundle ID on App Store Connect if it doesn't exist
#   2. Provisions an App Store distribution profile for com.dennispaul.PhotoCleaner
#   3. Commits the new profile + cert reference into Match-Secrets
#
# After it runs once successfully, the regular Build workflow can take
# over for every push.

on:
  workflow_dispatch:

env:
  TEAMID:             ${{ secrets.TEAMID }}
  GH_PAT:             ${{ secrets.GH_PAT }}
  GH_TOKEN:           ${{ secrets.GH_PAT }}
  FASTLANE_KEY_ID:    ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY:       ${{ secrets.FASTLANE_KEY }}
  MATCH_PASSWORD:     ${{ secrets.MATCH_PASSWORD }}

jobs:
  provision:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: bundle install

      - name: Patch fastlane match to skip table output
        run: |
          TABLE_PRINTER_PATH=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/match/lib/match/table_printer.rb
          if [ -f "$TABLE_PRINTER_PATH" ]; then
            sed -i "" "/puts(Terminal::Table.new(params))/d" "$TABLE_PRINTER_PATH"
          fi

      # Fix "invalid curve name" — fastlane's bundled token.rb uses
      # OpenSSL::PKey::EC.new which can't parse Apple's PKCS#8 .p8
      # keys on newer OpenSSL builds. Swap for OpenSSL::PKey.read.
      - name: Patch fastlane token.rb for PKCS#8 EC key parsing
        run: |
          TOKEN_RB=$(ruby -e 'puts Gem::Specification.find_by_name("fastlane").gem_dir')/spaceship/lib/spaceship/connect_api/token.rb
          if [ -f "$TOKEN_RB" ]; then
            sed -i "" 's|OpenSSL::PKey::EC\.new(key)|OpenSSL::PKey.read(key)|g' "$TOKEN_RB"
            echo "Patched: $TOKEN_RB"
            grep -n "OpenSSL::PKey" "$TOKEN_RB" | head -5
          else
            echo "::error::token.rb not found at expected path: $TOKEN_RB"
            exit 1
          fi

      # Diagnostic: print structural info about FASTLANE_KEY WITHOUT
      # exposing its value. GitHub's secret-masking redacts the actual
      # bytes, but length / line count / whether-PEM-or-base64 are safe
      # to surface. If "Looks like: base64-encoded body" we know
      # is_key_content_base64:true is correct; if "Looks like: raw PEM"
      # the format is fine and the bug is elsewhere.
      - name: Diagnose FASTLANE_KEY format
        env:
          KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          echo "Key length: ${#KEY} chars"
          LINES=$(printf '%s' "$KEY" | wc -l | tr -d ' ')
          echo "Line count: $LINES"
          FIRST=$(printf '%s' "$KEY" | head -c 30)
          # Only safe to print first few chars if they're PEM markers
          if printf '%s' "$KEY" | head -1 | grep -q "BEGIN PRIVATE KEY"; then
            echo "Looks like: raw PEM (starts with '-----BEGIN PRIVATE KEY-----')"
          elif printf '%s' "$KEY" | head -1 | grep -q "BEGIN"; then
            echo "Looks like: PEM with non-standard header"
          else
            echo "Looks like: base64-encoded body (no -----BEGIN header)"
          fi
          if printf '%s' "$KEY" | tail -1 | grep -q "END PRIVATE KEY"; then
            echo "Trailer: ends with '-----END PRIVATE KEY-----'"
          else
            echo "Trailer: no -----END marker"
          fi

      - name: Register bundle ID
        run: bundle exec fastlane identifiers

      - name: Provision certificate + App Store profile
        run: bundle exec fastlane certs
